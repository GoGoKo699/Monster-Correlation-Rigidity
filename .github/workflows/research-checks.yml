name: Research verification
on:
  push:
    branches: [research/probe-access, research/seysen-qqa-block, research/leech-xxa-block, research/jordan-a0-sector, research/normalizer-priority, research/pair-test-priority, research/physical-selection, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout pre-physical-selection baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 109e1cffd3c61f374635fec0a36f97e972d373e5
          path: baseline
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          persist-credentials: false
      - name: Use the recorded Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install recorded numerical dependency
        run: python3 -m pip install 'numpy==2.3.5'
      - name: Strict replay, existing portability policy, and branch checks
        shell: bash
        run: |
          set -euo pipefail
          inspector="$GITHUB_WORKSPACE/candidate/checks/replay_portability.py"
          for tree in baseline candidate; do
            (
              cd "$tree"
              if python3 verify.py 2>/tmp/monster-strict.err; then
                cat /tmp/monster-strict.err >&2
                echo "Strict byte replay passed for $tree"
              else
                cat /tmp/monster-strict.err >&2
                case "$(tail -n 1 /tmp/monster-strict.err)" in
                  "RuntimeError: prior average toy differs from recorded report under None"|"RuntimeError: prior pair toy differs from recorded report under None") ;;
                  *) echo "Unrecognized strict failure; refusing portability fallback" >&2; exit 1 ;;
                esac
                echo "::warning::Strict byte replay failed for $tree; inspect the original failure and separate bounded comparison."
              fi
              python3 "$inspector" --root .
              for script in checks/audit_*.py checks/verify_probe_access.py checks/verify_seysen_block.py checks/verify_leech_xxa.py checks/verify_a0_sector.py checks/verify_normalizer_priority.py checks/verify_pair_prior_art.py checks/verify_physical_selection.py; do
                test -f "$script" || continue
                python3 "$script" > /tmp/monster-normal.json
                python3 -O "$script" > /tmp/monster-O.json
                python3 -OO "$script" > /tmp/monster-OO.json
                cmp /tmp/monster-normal.json /tmp/monster-O.json
                cmp /tmp/monster-normal.json /tmp/monster-OO.json
                cat /tmp/monster-normal.json
                case "$script" in
                  checks/verify_probe_access.py) cmp /tmp/monster-normal.json results/probe_access.json ;;
                  checks/verify_seysen_block.py) cmp /tmp/monster-normal.json results/seysen_block.json ;;
                  checks/verify_leech_xxa.py) cmp /tmp/monster-normal.json results/leech_xxa_checks.json ;;
                  checks/verify_a0_sector.py) cmp /tmp/monster-normal.json results/a0_sector_checks.json ;;
                  checks/verify_normalizer_priority.py) cmp /tmp/monster-normal.json results/normalizer_priority.json ;;
                  checks/verify_pair_prior_art.py) cmp /tmp/monster-normal.json results/pair_prior_art.json ;;
                  checks/verify_physical_selection.py) cmp /tmp/monster-normal.json results/physical_selection.json ;;
                esac
              done
              test -z "$(git status --porcelain)"
              git diff --check
            )
          done

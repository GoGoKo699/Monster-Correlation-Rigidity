name: Research verification
on:
  push:
    branches: [research/probe-access, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout audited baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c48f2c7798f0c507d657cb43e9ce7c41d7d5b83d
          path: baseline
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: candidate
          persist-credentials: false
      - name: Use the recorded Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install recorded numerical dependency
        run: python3 -m pip install 'numpy==2.3.5'
      - name: Strict replay, explicit portability inspection, and new checks
        shell: bash
        run: |
          set -euo pipefail
          inspector="$GITHUB_WORKSPACE/candidate/checks/replay_portability.py"
          for tree in baseline candidate; do
            (
              cd "$tree"
              if python3 verify.py; then
                echo "Strict byte replay passed for $tree"
              else
                echo "::warning::Strict byte replay failed for $tree; inspect the original error above and the independent bounded comparison below."
              fi
              python3 "$inspector" --root .
              for script in checks/audit_*.py checks/verify_probe_access.py; do
                test -f "$script" || continue
                python3 "$script" > /tmp/monster-normal.json
                python3 -O "$script" > /tmp/monster-O.json
                python3 -OO "$script" > /tmp/monster-OO.json
                cmp /tmp/monster-normal.json /tmp/monster-O.json
                cmp /tmp/monster-normal.json /tmp/monster-OO.json
                cat /tmp/monster-normal.json
                if [ "$script" = checks/verify_probe_access.py ]; then
                  cmp /tmp/monster-normal.json results/probe_access.json
                fi
              done
              test -z "$(git status --porcelain)"
              git diff --check
            )
          done

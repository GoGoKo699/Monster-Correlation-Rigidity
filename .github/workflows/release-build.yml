name: Hash-pinned release candidate transfer
on:
  push:
    branches: [audit/release-build-20260927]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ecd0623e9de41b49754b6ca16dc23752443143af
          path: subject
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ecd0623e9de41b49754b6ca16dc23752443143af
          path: base
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Reconstruct, verify, and store exact candidate objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python harness/_release_build/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-transfer-current-checks
          path: ${{ runner.temp }}/current-checks
          if-no-files-found: ignore
          retention-days: 7
